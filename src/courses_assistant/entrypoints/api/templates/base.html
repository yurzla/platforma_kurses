<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Courses Assistant · Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Courses&nbsp;Assistant <span>· dashboard</span></div>
    <nav class="tabs">
      <button class="tab active" data-tab="jobs">Jobs</button>
      <button class="tab" data-tab="dlq">DLQ</button>
      <button class="tab" data-tab="streams">Streams</button>
    </nav>
    <div class="meta">обновлено: <span id="updated">—</span></div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/dashboard.js"></script>
</body>
</html>
