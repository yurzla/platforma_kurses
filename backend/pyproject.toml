[project]
name = "courses-assistant"
version = "0.1.0"
description = "RAG-ассистент для курсов (Clean Architecture, FastAPI, Redis Streams)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "typer>=0.12",
    "pyjwt>=2.8",
    "fpdf2>=2.7.4",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courses_assistant"]

[project.scripts]
courses-assistant-api = "courses_assistant.entrypoints.api.__main__:main"
courses-assistant-worker = "courses_assistant.entrypoints.worker.__main__:main"
courses-assistant-scheduler = "courses_assistant.entrypoints.scheduler.__main__:main"
courses-assistant-cron = "courses_assistant.entrypoints.cron.__main__:main"
courses-assistant-db = "courses_assistant.scripts.db_bootstrap:main"
courses-assistant-dump = "courses_assistant.scripts.stepik_dump:app"
courses-assistant-load = "courses_assistant.scripts.load_stepik:app"
courses-assistant-embed = "courses_assistant.scripts.embed_chunks:app"
courses-assistant-user = "courses_assistant.scripts.create_user:app"
courses-assistant-import-sources = "courses_assistant.scripts.import_step_sources:app"
