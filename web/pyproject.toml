[project]
name = "courses-web"
version = "0.1.0"
description = "Web-интерфейс Courses Assistant (Jinja2 + прокси к JSON API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courses_web"]

[project.scripts]
courses-web = "courses_web.__main__:main"
