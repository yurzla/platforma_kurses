<header class="topbar">
  <div class="brand"><a href="/courses" class="brand-link">Courses&nbsp;Assistant</a> <span>· обучение</span></div>
  <nav class="tabs">
    <a class="tab {% if active == 'courses' %}active{% endif %}" href="/courses">Курсы</a>
    {% if me and me.role == 'admin' %}
    <a class="tab {% if active == 'dashboard' %}active{% endif %}" href="/dashboard">Админ панель</a>
    {% endif %}
  </nav>
  <div class="meta">
    {% if me and me.role == 'admin' %}Администратор
    {% elif me and me.role %}{{ me.name or me.email }}
    {% endif %}
  </div>
  <div class="actions">
    <button type="button" class="btn ghost" data-theme-toggle aria-pressed="false">Тема</button>
    {% if me and me.role %}
    <form method="post" action="/logout">
      <button type="submit" class="btn ghost">Выйти</button>
    </form>
    {% else %}
    <a class="btn ghost" href="/login">Войти</a>
    {% endif %}
  </div>
</header>
